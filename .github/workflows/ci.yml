name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0
      - name: Test
        shell: pwsh
        run: go test -race ./...
      - name: Build Windows plugin
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify plugin export
        shell: pwsh
        run: |
          $exports = objdump -p dist/windows-amd64/cpa-codex-turn-state.dll
          if ($exports -notmatch 'cliproxy_plugin_init') { throw 'missing cliproxy_plugin_init export' }
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-codex-turn-state-windows-amd64
          path: dist/windows-amd64/cpa-codex-turn-state.dll
